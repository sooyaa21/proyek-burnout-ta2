<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prediksi Burnout Kesehatan Mental</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 80vh;
        }
        .container {
            background: #ffffff;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 520px;
        }
        h2 {
            color: #055b56;
            margin-bottom: 25px;
            text-align: center;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }
        input[type="number"], select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 16px;
            background-color: #fff;
        }
        button {
            background-color: #055b56;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            width: 100%;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 10px;
        }
        button:hover {
            background-color: #044743;
        }
        .result-box {
            margin-top: 30px;
            padding: 20px;
            background: #eef4f3;
            border-radius: 12px;
            border-left: 5px solid #055b56;
        }
        .result-box h3 {
            margin-top: 0;
            color: #055b56;
        }
        .badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Prediksi Burnout Kesehatan Mental</h2>
        
        <form method="POST">
            <div class="form-group">
                <label for="period">Pilih Periode Jam Kerja:</label>
                <select name="period" id="period">
                    <option value="minggu" {% if selected_period == 'minggu' %}selected{% endif %}>Per Minggu (Normal: 54 Jam)</option>
                    <option value="bulan" {% if selected_period == 'bulan' %}selected{% endif %}>Per Bulan (Normal: 216 Jam)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="work_hours">Total Jam Kerja:</label>
                <input type="number" step="any" id="work_hours" name="work_hours" value="{{ input_hours }}" placeholder="Masukkan total jam..." required>
            </div>
            
            <button type="submit">Hitung Prediksi</button>
        </form>

        {% if prediction_text %}
            <div class="result-box">
                <h3>Hasil Analisis</h3>
                <p><strong>{{ prediction_text }}</strong></p>
                {% if status_badge %}
                    <p>Status: <span class="badge" style="background-color: #d1e7dd; color: #0f5132;">{{ status_badge }}</span></p>
                {% endif %}
                {% if analysis_text %}
                    <p>{{ analysis_text }}</p>
                {% endif %}
            </div>
        {% endif %}
    </div>

</body>
</html>
